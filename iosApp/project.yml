name: BlakeTuner
options:
  bundleIdPrefix: com.blakelabs
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  BlakeTuner:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BlakeTuner
    info:
      path: BlakeTuner/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blakelabs.guitartuner.ios
        PRODUCT_NAME: Blake Labs Guitar Tuner
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Build shared Kotlin tuner core
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping duplicate Kotlin framework build"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - framework: ../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/BlakeTunerShared.framework
        embed: false
